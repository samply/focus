# DKFZ Hector Cancer Institute: the research db filled by the DHKI loader
# (TTP, Onkostar, LabCollector) and the MII-KDS data TransFAIR forwards.

fields:
  study:
    type: values
    cql: "exists([ResearchSubject] S where S.study.reference in {{value}})"
  # The TTP delivers gender as "U", which is not a FHIR code
  gender:
    type: values
    cql: |-
      (case when {{this}}.gender is null or {{this}}.gender.value in {'U', 'unknown'} then 'unknown'
        else {{this}}.gender.value end) in {{value}}
  birth_date:
    type: date
    cql: "{{this}}.birthDate between {{min}} and {{max}}"
  deceased:
    type: values
    cql: |-
      (case when {{this}}.deceased is FHIR.dateTime or ({{this}}.deceased as FHIR.boolean).value then 'true'
        else 'false' end) in {{value}}
  # Patients who granted every policy of every selected consent module. The
  # modules hold the policies the loader's ETL checks, by number
  # (dhki-consent-policies-<n>).
  consent:
    type: values
    cql: |-
      AllTrue((Flatten(({{value}}) M return
        case M
          when 'patient_data' then {2, 3, 4, 5, 6, 7, 8}
          when 'biomaterial' then {19, 20, 21, 22}
          when 'insurance_retro' then {11, 12, 13}
          when 'insurance_pro' then {15, 16, 17}
          else {0}
        end)) N
      return exists([Consent] C
        where C.status.value = 'active'
          and exists(C.provision.provision P
            where P.type.value = 'permit'
              and Today() >= date from P.period.start.value
              and Today() < date from P.period."end".value
              and exists(P.code.coding X
                where X.system.value = 'http://localhost:42000/fhir/policySet/DhkiConsentPolicyCodeSystem-1.0.0'
                  and X.code.value = 'dhki-consent-policies-' + ToString(N)))))
  # The loader has written the clinics' "ü" as "Ã¼", UTF-8 read as Latin-1
  department:
    type: values
    cql: "exists([Encounter] E where exists(E.identifier I where ReplaceMatches(I.value.value, 'Ã¼', 'ü') in {{value}}))"

scopes:
  diagnosis:
    resource_type: Condition
    temporal_date: "Coalesce({{this}}.recordedDate, {{this}}.onset as FHIR.dateTime)"
    fields:
      # C34 also matches its subcodes C34.0, C34.1, ...
      code:
        type: values
        cql: |-
          exists({{this}}.code.coding X
            where X.system.value = 'http://fhir.de/CodeSystem/bfarm/icd-10-gm'
              and exists(({{value}}) V where X.code.value = V or StartsWith(X.code.value, V + '.')))
      date:
        type: date
        cql: "Coalesce({{this}}.recordedDate, {{this}}.onset as FHIR.dateTime) between {{min}} and {{max}}"
      age:
        type: range
        cql: "AgeInYearsAt(Coalesce({{this}}.recordedDate, {{this}}.onset as FHIR.dateTime)) between {{min}} and {{max}}"
      # C16 also matches C16.1, which also matches the German extension C16.11
      localization:
        type: values
        cql: |-
          exists({{this}}.bodySite B where exists(B.coding X
            where X.system.value = 'urn:oid:2.16.840.1.113883.6.43.1'
              and exists(({{value}}) V where StartsWith(X.code.value, V))))
      # The loader writes the side as German words rather than oBDS codes
      side:
        type: values
        cql: |-
          exists({{this}}.bodySite B where exists(B.coding X
            where X.system.value in {'http://dktk.dkfz.de/fhir/onco/core/CodeSystem/SeitenlokalisationCS',
                'https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/CodeSystem/mii-cs-onko-seitenlokalisation'}
              and (case X.code.value
                when 'LINKS' then 'L' when 'RECHTS' then 'R' when 'BEIDSEITIG' then 'B'
                when 'MITTELLINIE' then 'M' when 'TRIFFT NICHT ZU' then 'T' when 'UNBEKANNT' then 'U'
                else X.code.value end) in {{value}}))
      # Histology and response are Observations pointing at the diagnosis through focus. The
      # code-filtered retrieves let blaze answer from its index; an unfiltered
      # retrieve scans the patient's whole observation compartment per condition.
      morphology:
        type: values
        cql: |-
          exists([Observation: Code '59847-4' from loinc] O
            where O.focus.reference.value contains ('Condition/' + {{this}}.id)
              and exists(((O.value as FHIR.CodeableConcept).coding) X where X.code.value in {{value}}))
      response:
        type: values
        cql: |-
          exists([Observation: Code '396432002' from snomed] O
            where O.focus.reference.value contains ('Condition/' + {{this}}.id)
              and exists(((O.value as FHIR.CodeableConcept).coding) X where X.code.value in {{value}}))

  procedure:
    resource_type: Procedure
    temporal_date: "Coalesce({{this}}.performed as FHIR.dateTime, ({{this}}.performed as FHIR.Period).start)"
    fields:
      # An OPS code also matches the codes below it: 5-45 matches 5-455, which
      # matches 5-455.41. The data writes the letters of OPS codes in upper
      # case (6-001.H), BfArM in lower case (6-001.h). The code may also be an
      # oBDS therapy type (OP, CH, …) of the MII oncology module.
      code:
        type: values
        cql: |-
          exists({{this}}.code.coding X
            where (X.system.value = 'http://fhir.de/CodeSystem/bfarm/ops'
                and exists(({{value}}) V where StartsWith(Upper(X.code.value), Upper(V))))
              or (X.system.value = 'https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/CodeSystem/mii-cs-onko-therapie-typ'
                and X.code.value in {{value}}))
      date:
        type: date
        cql: "Coalesce({{this}}.performed as FHIR.dateTime, ({{this}}.performed as FHIR.Period).start) between {{min}} and {{max}}"
      # PET/CT exams of the PRINCIPAL study, with their tracer and measurements
      # attached through partOf
      exam:
        type: values
        cql: "exists({{this}}.code.coding X where X.system.value = 'http://snomed.info/sct' and X.code.value in {{value}})"
      tracer:
        type: values
        cql: |-
          exists([MedicationAdministration] M
            where M.partOf.reference.value contains ('Procedure/' + {{this}}.id)
              and exists(((M.medication as FHIR.CodeableConcept).coding) X
                where X.system.value = 'https://hki-fhir.com/CodeSystem/DHKI.Tracertyp' and X.code.value in {{value}}))
      activity:
        type: range
        cql: |-
          exists([MedicationAdministration] M
            where M.partOf.reference.value contains ('Procedure/' + {{this}}.id)
              and M.dosage.dose.value.value between {{min}} and {{max}})
      pi_time:
        type: range
        cql: |-
          exists([Observation] O
            where O.partOf.reference.value contains ('Procedure/' + {{this}}.id)
              and O.code.coding.code.value contains 'PostInjectionTime'
              and (O.value as FHIR.Quantity).value.value between {{min}} and {{max}})
      glucose:
        type: range
        cql: |-
          exists([Observation] O
            where O.partOf.reference.value contains ('Procedure/' + {{this}}.id)
              and O.code.coding.code.value contains '2339-0'
              and (O.value as FHIR.Quantity).value.value between {{min}} and {{max}})
      weight:
        type: range
        cql: |-
          exists([Observation] O
            where O.partOf.reference.value contains ('Procedure/' + {{this}}.id)
              and O.code.coding.code.value contains '29463-7'
              and (O.value as FHIR.Quantity).value.value between {{min}} and {{max}})

  specimen:
    resource_type: Specimen
    fields:
      type:
        type: values
        cql: |-
          exists({{this}}.type.coding X
            where X.system.value = 'https://fhir.bbmri.de/CodeSystem/SampleMaterialType' and X.code.value in {{value}})

counts:
  patients:
    resource_type: Patient

stratifiers:
  gender:
    resource_type: Patient
    cql: |-
      case when {{this}}.gender is null or {{this}}.gender.value in {'U', 'unknown'} then 'unknown'
        else {{this}}.gender.value end
  # Decade of the age at the first diagnosis, as "0", "10", ... "90" (90 and older)
  age_at_diagnosis:
    resource_type: Patient
    filter: "{{this}}.birthDate is not null and exists ([Condition] C where Coalesce(C.recordedDate, C.onset as FHIR.dateTime) is not null)"
    cql: |-
      ToString(Min({AgeInYearsAt(Min([Condition] C
        return FHIRHelpers.ToDateTime(Coalesce(C.recordedDate, C.onset as FHIR.dateTime)))) div 10 * 10, 90}))
  # One stratum per patient: the 3-char ICD-10 of the tumour diagnosis. The
  # Onkostar Primaerdiagnose wins, since the KDS forwards the same diagnoses
  # again and counting conditions would multiply the counts; without one, the
  # smallest malignant diagnosis, then any coded diagnosis of the patient.
  diagnosis:
    resource_type: Patient
    cql: |-
      Substring(Coalesce(
        Min([Condition] C where exists (C.meta.profile P where P.value = 'http://dktk.dkfz.de/fhir/StructureDefinition/onco-core-Condition-Primaerdiagnose') return (First(C.code.coding.where(system = 'http://fhir.de/CodeSystem/bfarm/icd-10-gm'))).code.value),
        Min([Condition] C where exists (C.code.coding X where X.system.value = 'http://fhir.de/CodeSystem/bfarm/icd-10-gm' and StartsWith(X.code.value, 'C')) return (First(C.code.coding.where(system = 'http://fhir.de/CodeSystem/bfarm/icd-10-gm' and StartsWith(code, 'C')))).code.value),
        Min([Condition] C return (First(C.code.coding.where(system = 'http://fhir.de/CodeSystem/bfarm/icd-10-gm'))).code.value)
      ), 0, 3)
  # Procedures by OPS code, cut to the seven characters that tell a drug apart
  # (6-001.h), or else by oBDS therapy type. The explorer sorts them into its
  # procedure categories.
  procedure_code:
    resource_type: Procedure
    filter: |-
      exists({{this}}.code.coding X
        where X.system.value in {'http://fhir.de/CodeSystem/bfarm/ops',
          'https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/CodeSystem/mii-cs-onko-therapie-typ'})
    cql: |-
      Coalesce(
        Substring(First({{this}}.code.coding.where(system = 'http://fhir.de/CodeSystem/bfarm/ops')).code.value, 0, 7),
        First({{this}}.code.coding.where(system = 'https://www.medizininformatik-initiative.de/fhir/ext/modul-onko/CodeSystem/mii-cs-onko-therapie-typ')).code.value)
  specimen_type:
    resource_type: Specimen
    cql: "First({{this}}.type.coding.where(system = 'https://fhir.bbmri.de/CodeSystem/SampleMaterialType')).code.value"
  # The LabCollector analyte deposited in the sample
  specimen_subtype:
    resource_type: Specimen
    cql: "{{this}}.type.text.first()"
  # Cases per clinic: only the loader's department encounters, not the DIC's
  department:
    resource_type: Encounter
    filter: "exists({{this}}.identifier I where StartsWith(I.value.value, 'UMM/'))"
    cql: "ReplaceMatches(First({{this}}.identifier).value.value, 'Ã¼', 'ü')"

sensitivity:
  Condition: 3
  Procedure: 1.7
  Specimen: 20
  Encounter: 5

# Code systems referenced by the filtered retrieves in the fields above.
code_systems:
  loinc: "http://loinc.org"
  snomed: "http://snomed.info/sct"
